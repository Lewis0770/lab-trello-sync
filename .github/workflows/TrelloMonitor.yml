name: Trello Monitor

on:
  schedule:
    # Run every hour at minute 0
    - cron: '0 * * * *'
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write  # Needed to push changes back to the repository

jobs:
  monitor:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        # This ensures we get the latest state file
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
        # Create requirements.txt if it doesn't exist
        echo "requests" > requirements.txt
        
    - name: Check for existing state file
      run: |
        if [ -f "trello_state.json" ]; then
          echo "State file exists, will perform change detection"
          echo "STATE_EXISTS=true" >> $GITHUB_ENV
          ls -la trello_state.json
        else
          echo "No state file found, this will be the initial run"
          echo "STATE_EXISTS=false" >> $GITHUB_ENV
        fi
        
    - name: Run Trello Monitor
      env:
        TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
        TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
        TRELLO_BOARD_IDS: ${{ secrets.TRELLO_BOARD_IDS }}
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
        # Note: Not setting SMTP_HOST and SMTP_PORT as env vars since GitHub masks them
        # The Python script will use gmail defaults
        LABEL_EMAIL_MAPPING: ${{ secrets.LABEL_EMAIL_MAPPING }}
      run: |
        echo "Environment variables check:"
        echo "TRELLO_API_KEY: $([[ -n "$TRELLO_API_KEY" ]] && echo "SET" || echo "NOT SET")"
        echo "TRELLO_TOKEN: $([[ -n "$TRELLO_TOKEN" ]] && echo "SET" || echo "NOT SET")"
        echo "TRELLO_BOARD_IDS: $([[ -n "$TRELLO_BOARD_IDS" ]] && echo "SET" || echo "NOT SET")"
        echo "EMAIL_USER: $([[ -n "$EMAIL_USER" ]] && echo "SET" || echo "NOT SET")"
        echo "EMAIL_PASS: $([[ -n "$EMAIL_PASS" ]] && echo "SET" || echo "NOT SET")"
        echo "SMTP_HOST: Will use gmail defaults (smtp.gmail.com)"
        echo "SMTP_PORT: Will use gmail defaults (587)"
        echo "LABEL_EMAIL_MAPPING: $([[ -n "$LABEL_EMAIL_MAPPING" ]] && echo "SET" || echo "NOT SET")"
        echo ""
        echo "Starting Trello Monitor..."
        python trello_monitor.py
      
    - name: Check if state file was created/updated
      run: |
        if [ -f "trello_state.json" ]; then
          echo "State file exists after run"
          ls -la trello_state.json
          echo "File size: $(stat -f%z trello_state.json 2>/dev/null || stat -c%s trello_state.json)"
          echo "STATE_FILE_EXISTS=true" >> $GITHUB_ENV
        else
          echo "ERROR: State file was not created!"
          echo "STATE_FILE_EXISTS=false" >> $GITHUB_ENV
          exit 1
        fi
        
    - name: Commit and push state file
      if: env.STATE_FILE_EXISTS == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add trello_state.json
        # Only commit if there are changes
        if git diff --staged --quiet; then
          echo "No changes to state file"
        else
          git commit -m "Update Trello state [skip ci] - $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          git push
          echo "State file committed and pushed"
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Upload state file as artifact (backup)
      if: env.STATE_FILE_EXISTS == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: trello-state-backup
        path: trello_state.json
        retention-days: 30
