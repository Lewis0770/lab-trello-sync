name: Trello Monitor
on:
  schedule:
    # Run every hour at minute 0
  workflow_dispatch: # Allow manual triggering

jobs:
  monitor:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run Trello Monitor
      env:
        TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
        TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
        TRELLO_BOARD_IDS: ${{ secrets.TRELLO_BOARD_IDS }}
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
        SMTP_HOST: ${{ secrets.SMTP_HOST }}
        SMTP_PORT: ${{ secrets.SMTP_PORT }}
        LABEL_EMAIL_MAPPING: ${{ secrets.LABEL_EMAIL_MAPPING }}
      run: python trello_monitor.py
      
    - name: Commit and push state file
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add trello_state.json || true
        git diff --staged --quiet || git commit -m "Update Trello state [skip ci]" || true
        git push || true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
